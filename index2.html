<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Corner</title>
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f8f2;
    color: #263d29;
}

header {
    text-align: center;
    padding: 50px 20px;
    background: #263d29;
    color: white;
}

header h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.plants {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 50px 20px;
}

.plant {
    width: 220px;
    padding: 40px 20px;
    text-align: center;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 12px #0002;
}

.plant h2 {
    margin-bottom: 15px;
}

.plant p {
    font-size: 20px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 20px;
    background: #263d29;
    color: white;
}


    </style>
</head>
<body>

    <header>
        <h1>Green Corner</h1>
        <p>Bring a little green into your life 🌿</p>
    </header>

    <section class="plants">

        <div class="plant">
            <h2>Peace Lily</h2>
            <p>₹450</p>
        </div>

        <div class="plant">
            <h2>Aloe Vera</h2>
            <p>₹300</p>
        </div>

        <div class="plant">
            <h2>Snake Plant</h2>
            <p>₹550</p>
        </div>

    </section>

    <footer>
        <p>Made with love for plant lovers</p>
    </footer>

</body>
</html>
