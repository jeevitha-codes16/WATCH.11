<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lens & Light</title>
    
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 50px 20px;
}

header h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.gallery {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
}

.photo {
    width: 200px;
    height: 180px;
    background: #777;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    border-radius: 8px;
}

.about {
    text-align: center;
    padding: 30px 20px;
}

.about h2 {
    margin-bottom: 12px;
}

.about p {
    max-width: 500px;
    margin: auto;
    line-height: 1.6;
}

footer {
    margin-top: 30px;
    padding: 18px;
    background: #111;
    color: white;
    text-align: center;
}</style>
</head>

<body>

    <header>
        <h1>Lens & Light</h1>
        <p>Capturing moments, one frame at a time.</p>
    </header>

    <section class="gallery">
        <div class="photo">Nature</div>
        <div class="photo">People</div>
        <div class="photo">Travel</div>
    </section>

    <section class="about">
        <h2>About My Work</h2>
        <p>
            I capture simple moments, beautiful places and
            unforgettable memories through photography.
        </p>
    </section>

    <footer>
        <p>© 2026 Lens & Light</p>
    </footer>

</body>
</html>
